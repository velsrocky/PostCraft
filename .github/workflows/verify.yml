name: Verify

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libpipewire-0.3-dev libclang-dev ffmpeg
      - name: Verify Rust
        run: cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace
      - name: Verify Flutter
        working-directory: apps/desktop
        run: flutter analyze && flutter test
      - name: Build and validate Linux bundle
        run: make build-linux validate-linux-bundle
