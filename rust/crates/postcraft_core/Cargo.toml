[package]
name = "postcraft_core"
version = "0.1.0"
description = "Native image and platform services for PostCraft"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
postcraft_media = { path = "../postcraft_media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", features = ["blocking-api"] }
pipewire = { version = "0.10.1", features = ["v1_2_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
