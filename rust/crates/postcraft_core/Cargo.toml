[package]
name = "postcraft_core"
version = "0.1.0"
description = "Native image and platform services for PostCraft"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
postcraft_media = { path = "../postcraft_media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", features = ["blocking-api"] }
pipewire = { version = "0.10.1", features = ["v1_2_0"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
